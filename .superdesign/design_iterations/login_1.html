<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelSpot CCMS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pixelspot_theme.css">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        }
        
        body {
            background: var(--background) !important;
            color: var(--foreground) !important;
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh !important;
            background-image: 
                radial-gradient(circle at 20% 80%, var(--primary)/20 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, var(--secondary)/20 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, var(--accent)/10 0%, transparent 50%) !important;
        }

        .login-container {
            backdrop-filter: blur(20px) !important;
            background: var(--card)/80 !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius-xl) !important;
            box-shadow: var(--shadow-2xl) !important;
        }

        .form-input {
            background: var(--background) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius) !important;
            color: var(--foreground) !important;
            transition: all 0.2s ease !important;
        }

        .form-input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px var(--primary)/20 !important;
            outline: none !important;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
            color: white !important;
            border-radius: var(--radius) !important;
            font-weight: 600 !important;
            transition: all 0.3s ease !important;
            box-shadow: var(--shadow-lg) !important;
        }

        .login-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: var(--shadow-2xl) !important;
        }

        .login-btn:active {
            transform: translateY(0) !important;
        }

        .social-btn {
            background: var(--muted) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius) !important;
            color: var(--foreground) !important;
            transition: all 0.2s ease !important;
        }

        .social-btn:hover {
            background: var(--primary)/10 !important;
            border-color: var(--primary) !important;
        }

        .floating-shapes {
            position: absolute !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            z-index: -1 !important;
        }

        .shape {
            position: absolute !important;
            border-radius: 50% !important;
            opacity: 0.1 !important;
            animation: float 6s ease-in-out infinite !important;
        }

        .shape:nth-child(1) {
            width: 80px !important;
            height: 80px !important;
            background: var(--primary) !important;
            top: 20% !important;
            left: 10% !important;
            animation-delay: 0s !important;
        }

        .shape:nth-child(2) {
            width: 120px !important;
            height: 120px !important;
            background: var(--secondary) !important;
            top: 60% !important;
            right: 10% !important;
            animation-delay: 2s !important;
        }

        .shape:nth-child(3) {
            width: 60px !important;
            height: 60px !important;
            background: var(--accent) !important;
            bottom: 20% !important;
            left: 20% !important;
            animation-delay: 4s !important;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .slide-in {
            animation: slideIn 0.8s ease-out forwards !important;
            opacity: 0 !important;
            transform: translateY(30px) !important;
        }

        @keyframes slideIn {
            to {
                opacity: 1 !important;
                transform: translateY(0) !important;
            }
        }

        .logo-glow {
            filter: drop-shadow(0 0 20px var(--primary)/50) !important;
        }

        .input-group {
            position: relative !important;
        }

        .input-icon {
            position: absolute !important;
            left: 12px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            color: var(--muted-foreground) !important;
            z-index: 1 !important;
        }

        .form-input.with-icon {
            padding-left: 40px !important;
        }

        .password-toggle {
            position: absolute !important;
            right: 12px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            color: var(--muted-foreground) !important;
            cursor: pointer !important;
            z-index: 1 !important;
        }

        .password-toggle:hover {
            color: var(--primary) !important;
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="login-container w-full max-w-md p-8 slide-in">
            <!-- Logo and Header -->
            <div class="text-center mb-8">
                <div class="flex items-center justify-center mb-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-purple-600 rounded-xl mr-3 logo-glow"></div>
                    <h1 class="text-2xl font-bold">PixelSpot</h1>
                </div>
                <h2 class="text-xl font-semibold mb-2">Welcome back!</h2>
                <p class="text-gray-400">Sign in to your DOOH management dashboard</p>
            </div>

            <!-- Login Form -->
            <form class="space-y-6">
                <!-- Email Input -->
                <div class="input-group">
                    <i data-lucide="mail" class="input-icon w-4 h-4"></i>
                    <input 
                        type="email" 
                        placeholder="Enter your email"
                        class="form-input with-icon w-full px-4 py-3"
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <i data-lucide="lock" class="input-icon w-4 h-4"></i>
                    <input 
                        type="password" 
                        id="password"
                        placeholder="Enter your password"
                        class="form-input with-icon w-full px-4 py-3 pr-12"
                        required
                    >
                    <i data-lucide="eye" class="password-toggle w-4 h-4" onclick="togglePassword()"></i>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2 accent-orange-500">
                        <span class="text-sm text-gray-400">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-orange-500 hover:text-orange-400 transition-colors">
                        Forgot password?
                    </a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn w-full py-3 font-medium">
                    Sign In
                </button>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-gray-900 text-gray-400">Or continue with</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" class="social-btn flex items-center justify-center py-3">
                        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="social-btn flex items-center justify-center py-3">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/>
                        </svg>
                        Twitter
                    </button>
                </div>

                <!-- Sign Up Link -->
                <div class="text-center mt-6">
                    <p class="text-gray-400">
                        Don't have an account? 
                        <a href="#" class="text-orange-500 hover:text-orange-400 font-medium transition-colors">
                            Sign up for free
                        </a>
                    </p>
                </div>
            </form>

            <!-- Features -->
            <div class="mt-8 pt-6 border-t border-gray-700">
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div>
                        <div class="w-8 h-8 bg-orange-500/20 rounded-lg flex items-center justify-center mx-auto mb-2">
                            <i data-lucide="tv" class="w-4 h-4 text-orange-500"></i>
                        </div>
                        <p class="text-xs text-gray-400">Screen Management</p>
                    </div>
                    <div>
                        <div class="w-8 h-8 bg-purple-500/20 rounded-lg flex items-center justify-center mx-auto mb-2">
                            <i data-lucide="bar-chart-3" class="w-4 h-4 text-purple-500"></i>
                        </div>
                        <p class="text-xs text-gray-400">Real-time Analytics</p>
                    </div>
                    <div>
                        <div class="w-8 h-8 bg-green-500/20 rounded-lg flex items-center justify-center mx-auto mb-2">
                            <i data-lucide="zap" class="w-4 h-4 text-green-500"></i>
                        </div>
                        <p class="text-xs text-gray-400">Instant Deployment</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                toggleIcon.setAttribute('data-lucide', 'eye');
            }
            
            lucide.createIcons();
        }

        // Form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Add loading state
            const submitBtn = document.querySelector('.login-btn');
            const originalText = submitBtn.textContent;
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin inline"></i>Signing in...';
            submitBtn.disabled = true;
            
            lucide.createIcons();
            
            // Simulate login process
            setTimeout(() => {
                // Redirect to dashboard or show success
                window.location.href = 'dashboard_1.html';
            }, 2000);
        });

        // Add input focus animations
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
