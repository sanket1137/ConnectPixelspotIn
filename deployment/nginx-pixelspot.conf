# ==========================================
# NGINX CONFIGURATION FOR PIXELSPOT
# ==========================================
# Place this file in: /etc/nginx/sites-available/pixelspot
# Create symlink: ln -s /etc/nginx/sites-available/pixelspot /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload nginx: sudo systemctl reload nginx

# Upstream backend server configuration
upstream pixelspot_backend {
    # PM2 cluster mode runs on port 5000
    server 127.0.0.1:5000;
    
    # Keep-alive connections for better performance
    keepalive 64;
}

# HTTP Server (redirects to HTTPS after SSL is configured)
server {
    listen 80;
    listen [::]:80;
    
    # IMPORTANT: Replace with your actual domain
    server_name pixelspot.in www.pixelspot.in;
    
    # For Let's Encrypt SSL certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all HTTP traffic to HTTPS (uncomment after SSL is configured)
    # return 301 https://$server_name$request_uri;
    
    # Temporary: Serve the app on HTTP (remove after SSL setup)
    # Comment out everything below after SSL is configured
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/pixelspot_access.log;
    error_log /var/log/nginx/pixelspot_error.log;
    
    # Serve React frontend (built files)
    location / {
        root /var/www/pixelspot/dist/public;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Proxy API requests to Node.js backend
    location /api {
        proxy_pass http://pixelspot_backend;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }
    
    # File upload size limit
    client_max_body_size 10M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml;
}

