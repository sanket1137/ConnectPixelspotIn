# ==========================================
# CONFIGURATION NOTES
# ==========================================
#
# 1. Replace 'pixelspot.in' with your actual domain name
# 2. Initial HTTP-only configuration serves the app
# 3. After SSL certificate installation:
#    - Uncomment the HTTPS server block
#    - Uncomment the HTTP→HTTPS redirect
#    - Comment out the HTTP location blocks
# 4. Adjust client_max_body_size for larger file uploads
# 5. Modify gzip_comp_level (1-9) based on CPU vs bandwidth tradeoff
#
# ==========================================
